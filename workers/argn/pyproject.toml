[project]
name = "sts-argn-worker"
version = "0.1.0"
description = "Locked TabularARGN worker environment for Synthetic Table Studio"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mostlyai-engine==2.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argn_worker"]
