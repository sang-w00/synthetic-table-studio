[project]
name = "synthetic-table-studio-eval-worker"
version = "0.1.0"
description = "Isolated evaluation environment for Synthetic Table Studio"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.3.5",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
