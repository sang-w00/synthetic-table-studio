[project]
name = "synthetic-table-studio-app"
version = "0.1.0"
description = "Synthetic Table Studio control plane"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.5",
    "fastapi==0.139.2",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "psutil==7.2.2",
    "pyarrow==25.0.0",
    "pydantic==2.12.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
